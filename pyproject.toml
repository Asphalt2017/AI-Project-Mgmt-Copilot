[project]
name = "ai-copilot"
version = "0.1.0"
description = "Project intelligence connecting Jira requirements and GitHub implementation activity"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = []

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ai_copilot"]

[tool.ruff]
target-version = "py314"
src = ["ai_copilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.14"
files = ["ai_copilot"]
strict = true

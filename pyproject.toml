[project]
name = "ai-copilot"
version = "0.1.0"
description = "Project intelligence connecting Jira requirements and GitHub implementation activity"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "argon2-cffi>=25.1.0",
    "fastapi~=0.135",
    "jinja2~=3.1",
    "psycopg[binary]>=3.3.5",
    "pydantic-settings~=2.13",
    "python-multipart>=0.0.32",
    "pyyaml~=6.0",
    "sqlalchemy>=2.0.52",
    "uvicorn~=0.41",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ai_copilot"]

[tool.ruff]
target-version = "py314"
src = ["."]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.14"
files = ["ai_copilot"]
strict = true

[dependency-groups]
dev = [
    "httpx~=0.28",
    "mypy~=1.19",
    "pytest~=9.0",
    "ruff==0.16.0",
    "types-pyyaml~=6.0",
]

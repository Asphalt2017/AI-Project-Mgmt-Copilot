name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Application checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Install uv
        run: python -m pip install uv==0.11.19
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Test
        run: uv run --locked pytest
      - name: Type check
        run: uv run --locked mypy
      - name: Lint and format
        run: |
          uv run --locked ruff check .
          uv run --locked ruff format --check .

  pre-commit:
    name: Pre-commit checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Install pre-commit
        run: python -m pip install pre-commit==4.3.0
      - name: Check all files
        run: pre-commit run --all-files --show-diff-on-failure

  package:
    name: Build and install package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Install uv
        run: python -m pip install uv==0.11.19
      - name: Build distribution
        run: uv build
      - name: Install wheel
        run: uv pip install --system dist/*.whl
      - name: Verify installed package
        working-directory: ${{ runner.temp }}
        run: python -c "import ai_copilot; from importlib.metadata import version; print(version('ai-copilot'))"

  compose:
    name: Docker Compose validation
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Validate local database configuration
        env:
          POSTGRES_PASSWORD: ci-validation-only
        run: docker compose config --quiet

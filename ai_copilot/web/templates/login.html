<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · {{ config.name }}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='/app.css') }}">
</head>
<body class="login-body">
  <main class="login-card">
    <span class="brand-mark" aria-hidden="true">◈</span>
    <h1>Sign in</h1>
    <p>Welcome to {{ config.name }}.</p>
    {% if error %}<p class="login-error" role="alert">{{ error }}</p>{% endif %}
    <form method="post" action="{{ url_for('login') }}" class="login-form">
      <input type="hidden" name="csrf" value="{{ csrf }}">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="username" maxlength="254" required autofocus>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" maxlength="1024" required>
      <button type="submit">Sign in</button>
    </form>
    <p class="login-help">Contact your workspace administrator for an account.</p>
  </main>
</body>
</html>
